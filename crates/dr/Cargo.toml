[package]
name = "dr"
version = "1.0.0"
edition = "2021"
description = "Deep Research evidence substrate: citation identity, evidence store, claim ledger, report validation — Rust port of the deep-research skill scripts."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
strip = true

[workspace]
